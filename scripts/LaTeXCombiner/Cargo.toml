[package]
name = "LaTeXCombiner"
version = "0.1.0"
edition = "2024"

[dependencies]
glp = { git = "https://github.com/robby-Blue/glp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3